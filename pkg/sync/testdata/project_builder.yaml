name: isv:kubernetes:core:stable:v1.34:build
title: Kubernetes v1.34 (Stable Builder)
description: |
  This is a project used to build packages for Kubernetes v1.34. Don't use this project/repository directly, instead use "isv:kubernetes:core:stable:v1.34" project.
maintainers: [xmudrii, k8s-release-bot]
repositories:
  - name: rpm
    architectures: [x86_64, aarch64, ppc64le, s390x]
    paths:
      - project: SUSE:SLE-15-SP5:GA
        repository: standard
    releaseTargets:
      - project: isv:kubernetes:core:stable:v1.34
        repository: rpm
        trigger: manual
  - name: deb
    architectures: [x86_64, aarch64, ppc64le, s390x]
    paths:
      - project: Ubuntu:20.04
        repository: universe
      - project: Ubuntu:debbuild
        repository: Ubuntu_20.04
    releaseTargets:
      - project: isv:kubernetes:core:stable:v1.34
        repository: deb
        trigger: manual
